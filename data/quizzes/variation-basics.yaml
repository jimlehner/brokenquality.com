    explanation: The mean of the dataset [2, 5, 3, 4, 1, 3, 5, 2, 8, 4, 3, 3, 4] is 3.6 units.

  - id: q15
    question: What is a moving range?
    recommendation:
      title: "Understanding Numerical Summaries, Part 2: Measures of Dispersion"
      description: "This essay examines the role that measures of dispersion play in the calculation of process limits and explains why the standard deviation should not be used."
      url: "https://themathmatters.substack.com/p/measures-of-dispersion"
      priority: 1
    options:
      - text: The average deviation between successive values in a dataset
        correct: false
      - text: The average difference between successive values in a dataset
        correct: false
      - text: The absolute value of the difference between successive values in a dataset
        correct: true
      - text: The difference between successive values in a dataset
        correct: false
    explanation: A moving range is the absolute value of the difference between successive values in a dataset.

  - id: q16
    question: How do you improve an unpredictable process?
    recommendation:
      title: "The Process Principle"
      description: "This essay introduces readers to the process principle and its utility as a way of thinking about processes and systems."
      url: "https://themathmatters.substack.com/p/process-principle"
      priority: 1
    options:
      - text: By eliminating the influence of assignable causes of exceptional variation
        correct: true
      - text: By comparing process data to the specification limits
        correct: false
      - text: By eliminating the influence of common causes of routine variation
        correct: false
      - text: By introducing new technology, new equipment, new materials, and new procedures
        correct: false
    explanation: To improve an unpredictable process you must elimiante the influence of assignable causes of exceptional variation.

  - id: q17
    question: How do you improve a predictable process?
    recommendation:
      title: "The Taguchi Loss Function"
      description: "This essay explore how "
      url: "https://themathmatters.substack.com/p/process-principle"
      priority: 1
    options:
      - text: By comparing process data to the specification limits
        correct: false
      - text: By eliminating the influence of common causes of routine variation
        correct: false
      - text: By introducing new technology, new equipment, new materials, and new procedures
        correct: true
      - text: By eliminating the influence of assignable causes
        correct: false
    explanation: To improve a predictable process requires reengineering through the introduction of new technology, new equipment, new materials, and new procedures.

