  - id: q20
    question: To characterize a process is to...
    recommendation:
      title: "The Process Principle"
      description: "This essay introduces readers to the process principle and its utility as a way of thinking about processes and systems."
      url: "https://themathmatters.substack.com/p/process-principle"
      priority: 1
    options:
      - text: determine if the process average deviates from the mean.
        correct: true
      - text: determine if future process behavior is economically viable.
        correct: false
      - text: determine if the process will produce product within specifications.
        correct: false
      - text: determine if future process behavior can be predicted within limits.
