<div id="quiz-login">

    <h1>Login</h1>

    <input
        type="email"
        id="login-email"
        placeholder="Email"
    >

    <input
        type="password"
        id="login-password"
        placeholder="Password"
    >

    <button id="login-button">
        Log In
    </button>

    <p id="login-message"></p>

</div>

<div id="quiz-dashboard" style="display: none;">

    <p>You are logged in.</p>

    <div id="quiz-results"></div>

    <button id="logout-button">
        Log Out
    </button>

</div>
