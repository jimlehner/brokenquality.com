<header>

    <!-- Mobile menu overlay -->
    <div id="overlay"
        class="fixed inset-0 bg-black/90 backdrop-blur-md flex justify-center items-center z-50 transition-opacity duration-300 opacity-0 pointer-events-none"
        aria-hidden="true">

        <ul class="text-center list-none text-white space-y-6">
            {{ range .Site.Menus.main }}
            <li class="p-2 transform transition-transform hover:scale-110">
                <a href="{{ .URL | safeURL }}"
                    class="text-4xl font-semibold hover:text-gray-300 transition-colors">
                    <span>{{ .Name }}</span>
                </a>
            </li>
            {{ end }}
        </ul>

    </div>


    <!-- Site navigation -->
    <nav class="flex items-center justify-between p-8 pb-5 border-b border-gray-300/50">

        <!-- Logo -->
        <div class="flex items-center shrink-0 text-xl text-grey-900">
            <a href="{{ .Site.BaseURL }}">
                <img
                    alt="{{ .Site.Params.logo.alt }}"
                    class="{{ .Site.Params.logo.size }} mr-3"
                    src="{{ .Site.Params.logo.main | relURL }}">
            </a>
        </div>


        <!-- Desktop navigation -->
        <div id="desktopMenu" class="hidden lg:flex items-center gap-6">

            {{ range .Site.Menus.main }}
            <a href="{{ .URL | safeURL }}"
                class="duration-200 text-black hover:opacity-60">
                {{ .Name }}
            </a>
            {{ end }}

        </div>


        <!-- Mobile hamburger -->
        <div class="block lg:hidden">
            <div id="hamburgerbtn"
                class="flex cursor-pointer items-center w-14 h-10 py-2 rounded mopen">

                <span class="top"></span>
                <span class="middle"></span>
                <span class="bottom"></span>

            </div>
        </div>

    </nav>

</header>
